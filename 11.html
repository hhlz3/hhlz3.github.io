<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浪漫圣诞树</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; }
        body { background: #000; }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            z-index: 10;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div class="info">Merry Christmas</div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script>
        // 初始化场景、相机、渲染器
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 生成圣诞树粒子
        const particleCount = 8000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);

        // 圣诞树形状参数
        const height = 10;
        const maxRadius = 5;
        const heartRadius = 0.8;

        for (let i = 0; i < particleCount; i++) {
            // 计算粒子位置
            const t = Math.random();
            const y = t * height - height / 2;
            const radius = (1 - t) * maxRadius;
            const angle = Math.random() * Math.PI * 2;

            positions[i * 3] = radius * Math.cos(angle);
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = radius * Math.sin(angle);

            // 粉色渐变
            const color = new THREE.Color();
            color.setHSL(0.9, 0.8, 0.6 + Math.random() * 0.2);
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;

            sizes[i] = Math.random() * 2 + 1;
        }

        // 添加爱心顶部粒子
        const heartCount = 200;
        for (let i = 0; i < heartCount; i++) {
            const t = Math.random();
            const angle = Math.random() * Math.PI * 2;
            const r = Math.sqrt(t) * heartRadius;
            const x = r * Math.cos(angle);
            const z = r * Math.sin(angle);
            const y = height / 2 + Math.sqrt(heartRadius * heartRadius - r * r);

            positions.push(x, y, z);
            colors.push(1, 0.3, 0.5);
            sizes.push(3);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // 粒子材质
        const material = new THREE.PointsMaterial({
            size: 1.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const tree = new THREE.Points(geometry, material);
        scene.add(tree);

        // 雪花粒子
        const snowCount = 5000;
        const snowGeometry = new THREE.BufferGeometry();
        const snowPositions = new Float32Array(snowCount * 3);
        const snowSizes = new Float32Array(snowCount);

        for (let i = 0; i < snowCount; i++) {
            snowPositions[i * 3] = (Math.random() - 0.5) * 30;
            snowPositions[i * 3 + 1] = Math.random() * 20 - 5;
            snowPositions[i * 3 + 2] = (Math.random() - 0.5) * 30;
            snowSizes[i] = Math.random() * 1.5 + 0.5;
        }

        snowGeometry.setAttribute('position', new THREE.BufferAttribute(snowPositions, 3));
        snowGeometry.setAttribute('size', new THREE.BufferAttribute(snowSizes, 1));

        const snowMaterial = new THREE.PointsMaterial({
            size: 1,
            color: 0xffffff,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const snow = new THREE.Points(snowGeometry, snowMaterial);
        scene.add(snow);

        // 地面粒子
        const groundCount = 3000;
        const groundGeometry = new THREE.BufferGeometry();
        const groundPositions = new Float32Array(groundCount * 3);

        for (let i = 0; i < groundCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * 15;
            groundPositions[i * 3] = r * Math.cos(angle);
            groundPositions[i * 3 + 1] = -height / 2 - 1;
            groundPositions[i * 3 + 2] = r * Math.sin(angle);
        }

        groundGeometry.setAttribute('position', new THREE.BufferAttribute(groundPositions, 3));

        const groundMaterial = new THREE.PointsMaterial({
            size: 1,
            color: 0xffffff,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });

        const ground = new THREE.Points(groundGeometry, groundMaterial);
        scene.add(ground);

        // 相机位置
        camera.position.z = 15;

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            // 圣诞树旋转
            tree.rotation.y += 0.005;
            ground.rotation.y += 0.003;

            // 雪花下落
            const snowPos = snowGeometry.attributes.position.array;
            for (let i = 0; i < snowCount; i++) {
                snowPos[i * 3 + 1] -= 0.02;
                if (snowPos[i * 3 + 1] < -10) {
                    snowPos[i * 3 + 1] = 10;
                }
            }
            snowGeometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
